[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-runtime"
version = "0.1.0"
description = "Atlas Orchestration Runtime with Enforceable State Machine"
authors = [{name = "Atlas"}]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
atlas = "atlas_runtime.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_runtime*"]
