name: Auto Developer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Atlas never takes direct PRs to `main`: work lands on `dev` and is promoted to
# `main` via `/promote` (see promote.yml). The opencode runner has no input for
# the PR base and always targets the repository default branch (`main`), so the
# job below cuts its branch from, and retargets its PR at, this branch.
env:
  TARGET_BRANCH: dev

# One run per issue. A second `action:develop` label waits instead of
# racing the first run and opening a duplicate branch/PR.
concurrency:
  group: auto-developer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop:
    if: github.event.label.name == 'action:develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Cut the feature branch from the target branch (not the default branch
      # an `issues` event would otherwise check out), so the PR retargeted
      # below merges cleanly into it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Configure git identity
        run: |
          # opencode's GitHub runner commits its own changes and pushes a
          # branch (then opens the PR). It refuses to commit unless an author
          # identity is configured, which is why earlier runs failed with
          # "Author identity unknown".
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Protect .github/workflows
        # PROMOTE_PAT deliberately lacks the `workflows` permission, so any
        # commit touching .github/workflows is rejected at push time and the
        # whole run fails (issue #26's run tried to edit release.yml). Make the
        # directory read-only so the agent cannot spend its budget on a change
        # that can never land, and cannot discover the problem only at the end.
        # Best effort: it stops writes, not a determined `chmod`, which the
        # prompt also covers.
        run: chmod -R a-w .github/workflows

      - name: Run OpenCode
        id: opencode
        uses: anomalyco/opencode/github@v1.18.4
        env:
          # Must NOT be secrets.GITHUB_TOKEN: GitHub suppresses workflow runs
          # for `push`/`pull_request` events raised by GITHUB_TOKEN, so a
          # GITHUB_TOKEN PR would never trigger auto-reviewer or Validate
          # Bundle and the chain would stall the instant the PR opened.
          # PROMOTE_PAT is the repo's automation identity (classic `repo`
          # scope, or Contents + Pull requests + Issues write if fine-grained).
          GITHUB_TOKEN: ${{ secrets.PROMOTE_PAT }}
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            Implement this feature: ${{ github.event.issue.title }}

            Steps:
            1. Read the issue body for requirements
            2. Explore relevant Atlas files
            3. Make minimal, focused changes
            4. Update knowledge/manifest if needed

            Keep changes small and targeted. Follow existing patterns.

            Do not create or modify anything under `.github/workflows/`. The
            automation token cannot push those files — GitHub rejects the push
            without the `workflows` permission and the entire run fails. If a
            workflow change is genuinely needed, leave the workflows untouched
            and describe the change in the pull request body so a human can
            apply it separately.

            Work efficiently. The job has a bounded time limit and the model is
            slow here, so prefer one small correct change over an exhaustive
            one, and stop as soon as the change is complete.

      - name: Finalize PR (retarget and title)
        # The opencode action hardcodes the PR base to the repository's
        # default branch (main); it exposes no input for it. Atlas never takes
        # direct PRs to main, so repoint the PR it just opened at TARGET_BRANCH.
        # `always()` so a failure after the PR is opened still retargets it.
        #
        # The title is set from the issue as well. The action derives the PR
        # title from the model's own words, which is usually fine and
        # occasionally rambling (PR #59's title was the model's reflection on
        # summarising), and the title becomes the permanent squash-commit
        # subject on `dev` and `main`. The issue title is deterministic.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OUTCOME: ${{ steps.opencode.outcome }}
        run: |
          set -euo pipefail
          # The runner names issue branches `opencode/issue<N>-<timestamp>`;
          # this mirrors that contract (github/index.ts, generateBranchName).
          prefix="opencode/issue${ISSUE_NUM}-"
          prs="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 300 \
            --json number,headRefName,baseRefName \
            --jq ".[] | select(.headRefName | startswith(\"${prefix}\")) | [.number, .baseRefName] | @tsv")"
          if [ -z "${prs}" ]; then
            echo "No open PR from ${prefix}*; nothing to retarget."
            # The agent ran cleanly but produced no branch, so there is nothing
            # to review. Say so rather than leaving the issue sitting on
            # `action:develop` with no visible reason. A failed step is reported
            # by the next step instead.
            if [ "${OUTCOME}" = "success" ]; then
              gh issue comment "${ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" \
                --body "Automated development produced no changes, so there is no pull request to review. Comment here or remove and re-add the \`action:develop\` label to retry."
            fi
            exit 0
          fi
          while IFS=$'\t' read -r number base; do
            if [ "${base}" = "${TARGET_BRANCH}" ]; then
              echo "PR #${number} already targets ${TARGET_BRANCH}; normalizing title."
            else
              echo "Retargeting PR #${number}: ${base} -> ${TARGET_BRANCH}"
            fi
            gh pr edit "${number}" --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" --title "${ISSUE_TITLE}"
          done <<< "${prs}"

      - name: Report failure on the issue
        # "Intervene only when something breaks" only works if a break is
        # visible. Without this, a failed run leaves an issue that looks queued
        # forever. The retry is removing and re-adding the label.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" --body \
            "Automated development failed: ${RUN_URL}

          Once the cause is fixed, remove and re-add the \`action:develop\` label to retry."
