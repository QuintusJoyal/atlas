name: Retry size-rejected PRs

# When the reviewer rejects a PR for being over the size budget, close it
# and re-queue the issue so the serial pipeline tries again with a tighter
# implementation. Without this, a CHANGES_REQUESTED PR keeps the issue stuck
# (the queue only starts issues with no open PR) and the lane never advances.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: retry-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retry:
    # Only act on our bot's size-gate rejections
    if: github.event.review.state == 'changes_requested' && github.event.review.user.login == 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close oversized PR and re-queue
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          REVIEW_BODY: ${{ github.event.review.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          # Only retry when rejected by the size gate
          if [[ "${REVIEW_BODY}" != *"over the 20-file / 1000-line review budget"* ]]; then
            echo "Not a size-budget rejection; leaving PR open."
            exit 0
          fi

          # Extract issue number from branch like opencode/issue123-...
          if [[ "${BRANCH}" =~ opencode/issue([0-9]+)- ]]; then
            issue="${BASH_REMATCH[1]}"
          else
            echo "Could not extract issue number from ${BRANCH}"
            exit 0
          fi

          echo "Retrying issue #${issue} (closing PR #${PR_NUM}) due to size budget rejection."

          gh pr close "${PR_NUM}" --repo "${repo}" \
            --comment "Auto-retrying: PR exceeds the 20-file / 1000-line review budget. Closing so the serial pipeline re-implements this issue with a smaller, split-friendly change."

          # Make sure it's queued for development
          gh issue edit "${issue}" --repo "${repo}" --remove-label action:develop 2>/dev/null || true
          sleep 2
          gh issue edit "${issue}" --repo "${repo}" --add-label action:develop

          # Nudge the queue to pick it up immediately
          gh workflow run queue.yml --repo "${repo}" --ref main 2>/dev/null || true
