name: Trend Investigator

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Weekly research run. Do not start a second one while the first is still
# filing issues.
concurrency:
  group: trend-investigator
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.4
        env:
          # PROMOTE_PAT, not GITHUB_TOKEN: the issues this step files have to
          # raise a real `issues: opened` / `issues: labeled` event so that
          # Feature Reviewer wakes up and evaluates them. GitHub suppresses
          # workflow runs for events caused by the built-in GITHUB_TOKEN, so a
          # bot-filed issue would be filed and then silently never reviewed —
          # which is exactly what happened to every issue from #26 to #50.
          GITHUB_TOKEN: ${{ secrets.PROMOTE_PAT }}
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            Research AI agent trends and Atlas gaps. Create 2-3 feature request issues.

            Before creating any issue, check for near-duplicates first:
            gh issue list --label "type:feature" --state open --limit 100

            Skip any topic that substantially overlaps an existing open
            "type:feature" issue rather than filing a near-duplicate.

            For each genuinely new issue use gh CLI:
            gh issue create --title "[FEATURE]: <title>" --label "type:feature,priority:P1" --body "## Description\n<what>\n\n## Motivation\n<why>\n\n## Acceptance Criteria\n- [ ] <criteria>"

            Focus on: agent orchestration, context engineering, security, knowledge management.
            Keep issues concise (under 200 words each).
