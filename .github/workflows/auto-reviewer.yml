name: Auto Reviewer

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

# This job approves PRs, which needs the repository setting
# Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests"
# (API: can_approve_pull_request_reviews). With it off, `gh pr review
# --approve` returns 403 and the reviewer can only leave a COMMENTED review,
# which does not satisfy branch protection and stalls auto-merge.
#
# The review is submitted by a workflow step, not by the agent. Prompting the
# agent to run `gh pr review` itself is unreliable: it sometimes narrates the
# command in a code block and never runs it (observed on PR #55), which leaves
# the PR with no review at all and silently stalls the chain. The agent only
# decides a verdict and writes it to a file; the shell step always submits it.

concurrency:
  group: auto-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get a read-only GITHUB_TOKEN and no secrets, so `gh pr review`
    # cannot submit a review there. Skip forks rather than fail; fork PRs still
    # go through the normal human review path.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FILE: ${{ runner.temp }}/atlas-review.txt
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            Review this PR concisely. Check:
            1. Code quality
            2. Atlas conventions
            3. Knowledge cross-refs
            4. Token budgets

            Do not run `gh` and do not try to post anything yourself — the
            workflow submits the review for you. Your only job is to write the
            verdict to a file, using a tool (do not merely print it).

            Create the file `${{ runner.temp }}/atlas-review.txt` containing
            exactly two lines:

              verdict: approve
              body: - <2-3 bullet summary, under 100 words>

            The verdict must be one of:
              approve          nothing must change; safe to merge
              request-changes  must not merge as-is; name what is missing
              comment          you are unsure; leave the decision to a human

            Use `approve` only when the change is correct and self-contained.

      - name: Submit review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FILE: ${{ runner.temp }}/atlas-review.txt
        run: |
          set -euo pipefail

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "::error::Reviewer produced no verdict file at $REVIEW_FILE"
            gh pr comment "$PR_NUMBER" \
              --body "Automated review produced no verdict. Needs a human look."
            exit 1
          fi

          verdict=$(sed -n 's/^verdict:[[:space:]]*//Ip' "$REVIEW_FILE" \
            | head -n1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          body=$(sed -n 's/^body:[[:space:]]*//Ip' "$REVIEW_FILE" \
            | head -n1 | tr -d '\r')
          [ -n "$body" ] || body="Automated review (no summary provided)."

          case "$verdict" in
            approve)         flag=--approve ;;
            request-changes) flag=--request-changes ;;
            comment)         flag=--comment ;;
            *)
              echo "::warning::Unknown verdict '${verdict}'; recording as a comment."
              flag=--comment
              ;;
          esac

          if gh pr review "$PR_NUMBER" "$flag" --body "$body"; then
            exit 0
          fi

          # The one recoverable failure: the repo forbids Actions from
          # approving. Degrade to a comment so the verdict is still recorded.
          if [ "$flag" = "--approve" ]; then
            echo "::warning::Approval rejected; is can_approve_pull_request_reviews on? Recording as a comment."
            gh pr review "$PR_NUMBER" --comment --body "[approve requested] $body"
          else
            exit 1
          fi
