name: Auto Reviewer

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

# This job approves PRs, which needs the repository setting
# Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests"
# (API: can_approve_pull_request_reviews). With it off, `gh pr review
# --approve` returns 403 and the reviewer can only leave a COMMENTED review,
# which does not satisfy branch protection and stalls auto-merge.

concurrency:
  group: auto-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get a read-only GITHUB_TOKEN and no secrets, so `gh pr review`
    # cannot submit a review there. Skip forks rather than fail; fork PRs still
    # go through the normal human review path.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            Review this PR concisely. Check:
            1. Code quality
            2. Atlas conventions
            3. Knowledge cross-refs
            4. Token budgets

            Decide a verdict: approve, request-changes, or comment, then submit
            it as a real PR review — not a plain comment — with the gh CLI
            (PR_NUMBER is set in the environment):

              gh pr review "$PR_NUMBER" --approve --body "<2-3 bullet summary>"
              gh pr review "$PR_NUMBER" --request-changes --body "<2-3 bullet summary, name what must change>"
              gh pr review "$PR_NUMBER" --comment --body "<2-3 bullet summary>"

            Always run the command matching your verdict FIRST. A plain comment
            is not a substitute for a review: only a submitted `--approve`
            review lets auto-merge land the PR.

            If (and only if) `--approve` fails with "GitHub Actions is not
            permitted to approve pull requests", retry with `--comment` and
            state the approve verdict in the body.

            Keep the body under 100 words.
