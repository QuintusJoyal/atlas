name: Auto Reviewer

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FILE: ${{ github.workspace }}/.atlas/review-verdict.txt
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            Review this PR concisely. Check:
            1. Code quality
            2. Atlas conventions
            3. Knowledge cross-refs
            4. Token budgets

            Budget: finish in at most 15 tool calls, then write the verdict.
            The model is slow here, and an exhaustive review runs out of the
            job's time limit — PR #63 spent 40 minutes and 113 shell calls
            comparing every schema file and was cancelled with no review at all.
            A short review that lands beats a thorough one that does not.

            Start with `gh pr diff --stat` (read-only), then read the diff with
            `gh pr diff`. Open at most a handful of changed files, and only
            where the diff alone is not enough to judge the change. Do not walk
            or script over the whole tree, and do not re-read a file you have
            already seen.

            Do not post anything with `gh` (no `gh pr review`, no `gh pr
            comment`) — the workflow submits the review for you. Your only job
            is to write the verdict to a file, using a tool (do not merely
            print it).

            Create the file `.atlas/review-verdict.txt` (inside this
            repository; the `.atlas/` directory is gitignored, so create it if
            it is missing) containing exactly two lines:

              verdict: approve
              body: - <2-3 bullet summary, under 100 words>

            The verdict must be one of:
              approve          nothing must change; safe to merge
              request-changes  must not merge as-is; name what is missing
              comment          you are unsure; leave the decision to a human

            Use `approve` only when the change is correct and self-contained.

      - name: Submit review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FILE: ${{ github.workspace }}/.atlas/review-verdict.txt
        run: |
          set -euo pipefail

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "::error::Reviewer produced no verdict file at $REVIEW_FILE"
            gh pr comment "$PR_NUMBER" \
              --body "Automated review produced no verdict. Needs a human look."
            exit 1
          fi

          verdict=$(sed -n 's/^verdict:[[:space:]]*//Ip' "$REVIEW_FILE" \
            | head -n1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          body=$(sed -n 's/^body:[[:space:]]*//Ip' "$REVIEW_FILE" \
            | head -n1 | tr -d '\r')
          [ -n "$body" ] || body="Automated review (no summary provided)."

          case "$verdict" in
            approve)         flag=--approve ;;
            request-changes) flag=--request-changes ;;
            comment)         flag=--comment ;;
            *)
              echo "::warning::Unknown verdict '${verdict}'; recording as a comment."
              flag=--comment
              ;;
          esac

          if gh pr review "$PR_NUMBER" "$flag" --body "$body"; then
            exit 0
          fi

          if [ "$flag" = "--approve" ]; then
            echo "::warning::Approval rejected; is can_approve_pull_request_reviews on? Recording as a comment."
            gh pr review "$PR_NUMBER" --comment --body "[approve requested] $body"
          else
            exit 1
          fi
