name: Feature Reviewer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

# The front half of the chain: a new `type:feature` issue gets an evaluation,
# and the evaluation hands it straight to development by acquiring
# `action:develop` (see auto-developer.yml). An `action:evaluate` label re-runs
# the evaluation on demand, which is also how the existing backlog is swept.
#
# The evaluation text is posted by the action, not by the agent: on an issue
# event whose branch ends up clean, the action comments the agent's final
# message verbatim. The prompt therefore tells the agent to *reply* with the
# evaluation and not to run `gh`, so a model that narrates a command instead of
# running it cannot leave a missing or duplicated comment.
#
# It fires on `opened` (with the `type:feature` label) or on a `labeled` event
# for `type:feature` / `action:evaluate`. Both paths are kept because the label
# need not be present in the `opened` payload — if it is applied a moment later,
# the `labeled` event covers it.

# Development is the stage that had to be serialised (auto-developer.yml runs
# WIP = 1); evaluation cuts no branch and touches no files, so there is nothing
# to conflict here. Keeping the group per issue only means a repeated label for
# the same issue waits instead of double-evaluating.
#
# `cancel-in-progress` must stay false. The hand-off step below labels the issue
# `action:develop`, which raises a second `issues: labeled` event for the same
# issue, so a new run enters this group. With `cancel-in-progress: true` that new
# run (skipped by the job `if`) still cancels the run that just issued the label,
# which is how a successful evaluation of issue #26 was reported as "cancelled".
# The duplicate now waits, then skips, and costs nothing.
concurrency:
  group: feature-reviewer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'type:feature')) ||
      (github.event.action == 'labeled' && (
        github.event.label.name == 'action:evaluate' ||
        github.event.label.name == 'type:feature'
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            Evaluate this feature request. Your reply is posted as the issue
            comment automatically — do not run `gh`, and do not edit any file.

            Issue: ${{ github.event.issue.title }}

            Reply with exactly:

            ## Evaluation

            | Feasibility | Priority | Effort | Risk |
            |-------------|----------|--------|------|
            | <H/M/L> | <P0-P3> | <S/M/L> | <L/M/H> |

            ### Approach
            <2-3 sentences>

            ### Key Risks
            <1-2 bullets>

            Keep it under 150 words.

      - name: Hand off to development
        # The evaluation is the gate: once it is posted the issue moves to the
        # development half of the chain by acquiring `action:develop`.
        #
        # PROMOTE_PAT, not GITHUB_TOKEN: a label applied with GITHUB_TOKEN
        # raises no `issues: labeled` event, so auto-developer would never see
        # it and the issue would stop here — the same suppression that left
        # every bot-filed issue unevaluated.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "${ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" \
            --add-label action:develop
          # `action:evaluate` means "evaluate this", not "evaluate forever", so
          # drop it; absent is fine.
          gh issue edit "${ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" \
            --remove-label action:evaluate || true
