name: Queue

# Drains the pipeline one issue at a time.
#
# auto-developer.yml runs with WIP = 1: every feature edits the same shared files
# (`manifest.json`'s `integrity` hash map, `CHANGELOG.md`, `rules/atlas-core.md`),
# so two implementations in flight at once are guaranteed to collide when the
# second one merges. That collision stranded 28 PRs, 13 of them approved.
#
# A concurrency group can only serialise *runs*; it cannot express "wait until
# that PR has merged". So the lane is drained here on a schedule: when nothing is
# in flight, re-trigger the oldest waiting issue. This is a safety net as
# well - an issue whose run yielded the lane, or whose PR was closed, is picked
# up on the next pass rather than sitting forever.
#
# Development is started by re-adding `action:develop`, which is the one trigger
# auto-developer.yml listens for and which `gh` can raise where GITHUB_TOKEN
# cannot.

on:
  schedule:
    # Offset from the quarter hour so it never collides with another schedule.
    - cron: "7,22,37,52 * * * *"
  # Escape hatch: `gh workflow run queue.yml` to drain one issue on demand.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

# At most one drain at a time, so two schedules cannot start two issues.
concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start the next queued issue if the lane is free
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          # Lane occupancy: open implementation PRs still moving through review.
          # A PR the reviewer rejected is parked, not work in progress, so it
          # must not hold the lane open forever.
          wip="$(gh pr list --repo "${repo}" --state open --limit 300 \
            --json headRefName,latestReviews \
            --jq '[.[] | select(.headRefName | startswith("opencode/issue"))
                  | select([.latestReviews[].state] | index("CHANGES_REQUESTED") | not)]
                  | length')"
          if [ "${wip}" -gt 0 ]; then
            echo "Lane busy: ${wip} implementation PR(s) in flight. Nothing to start."
            exit 0
          fi

          # Oldest waiting issue: labelled for development with no open PR of its
          # own. Skip sub-issues until their dependencies are closed/merged.
          waiting="$(gh issue list --repo "${repo}" --state open --label action:develop \
            --limit 300 --json number,createdAt,body,title --jq 'sort_by(.createdAt) | .[] | \"\(.number)|\(.body|tostring)|\(.title)\"')"
          if [ -z "${waiting}" ]; then
            echo "Queue empty."
            exit 0
          fi

          while IFS='|' read -r n body title; do
            [ -n "${n}" ] || continue
            # Check if it's a sub-issue with dependencies
            if echo "$title" | grep -q '^\[SUB\]'; then
              # Check if all dependencies (issue refs) are closed/merged
              deps=$(echo "$body" | grep -oP '(?<=Depends on:)[^\n]+' | grep -oP '#\d+' || true)
              if [ -n "$deps" ]; then
                blocked=0
                while read -r dep; do
                  [ -n "$dep" ] || continue
                  depnum=$(echo "$dep" | tr -d '#')
                  state=$(gh issue view "$depnum" --repo "$repo" --json state --jq '.state' 2>/dev/null || echo "OPEN")
                  if [ "$state" = "OPEN" ]; then
                    echo "Issue #${n} blocked by #${depnum} (still open)"
                    blocked=1
                    break
                  fi
                done <<< "$deps"
                if [ "$blocked" -eq 1 ]; then
                  continue
                fi
              fi
            fi
            
            open="$(gh pr list --repo "${repo}" --state open --limit 300 \
              --json headRefName \
              --jq \"[.[] | select(.headRefName | startswith(\\\"opencode/issue${n}-\\\"))] | length\")"
            if [ "${open}" -gt 0 ]; then
              continue
            fi
            echo "Starting issue #${n}."
            gh issue edit "${n}" --repo "${repo}" --remove-label action:develop
            sleep 2
            gh issue edit "${n}" --repo "${repo}" --add-label action:develop
            exit 0
          done <<< "${waiting}"

          echo "Every waiting issue is either blocked by dependencies or already has an open PR."
