name: Auto Merge

# Closes the loop on `action:develop`: once Auto Reviewer approves a PR into
# `dev`, squash-merge it so nobody has to click the button. This only handles
# the integration branch (`dev`); `dev` -> `main` is a separate promotion step
# in promote.yml, so `main` keeps its single reviewed entry point.
#
# The job reads the PR's *current* state instead of trusting the trigger,
# because approval and retargeting race: auto-developer opens its PR against
# the default branch and immediately edits the base to `dev`, while
# auto-reviewer is already running. Whichever of the two events lands last is
# what must merge the PR, so both are triggers and neither is assumed.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    # Same-repo only: fork PRs get no secrets and are routed to human review,
    # matching auto-reviewer. `main` never merges here (promote.yml owns it).
    if: |
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Merge once approved and green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # A submitted approval is not enough on its own: `--request-changes`
          # after an approval (or vice versa) must win. latestReviews keeps one
          # review per reviewer, so require an APPROVED entry and no
          # CHANGES_REQUESTED one.
          approved=$(gh pr view "$PR" --json latestReviews \
            --jq '[.latestReviews[] | select(.state == "APPROVED")] | length')
          changes=$(gh pr view "$PR" --json latestReviews \
            --jq '[.latestReviews[] | select(.state == "CHANGES_REQUESTED")] | length')
          if [ "$approved" -eq 0 ] || [ "$changes" -gt 0 ]; then
            echo "PR #${PR} has no current approval; nothing to merge."
            exit 0
          fi

          # Auto Reviewer can approve within seconds of `opened`, often before
          # Validate Bundle has registered its check run. Wait for a check to
          # exist before trusting `gh pr checks`, otherwise an empty run list
          # would look like "nothing to fail" and merge an unvalidated PR.
          # `|| true` keeps `set -e` off the assignment: `gh pr checks` exits 8
          # while checks are pending, which is expected here and not an error.
          for _ in $(seq 1 60); do
            count=$(gh pr checks "$PR" --json name --jq 'length' 2>/dev/null) || true
            if [ "${count:-0}" -gt 0 ]; then
              break
            fi
            sleep 10
          done

          # --watch blocks until every check finishes and exits non-zero if any
          # failed, so a red PR is left open for a human instead of merged.
          gh pr checks "$PR" --watch --interval 15

          gh pr merge "$PR" --squash --delete-branch
