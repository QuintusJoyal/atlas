name: Auto Merge

# Closes the loop on `action:develop`: once Auto Reviewer approves a PR into
# `dev`, squash-merge it so nobody has to click the button. This only handles
# the integration branch (`dev`); `dev` -> `main` is a separate promotion step
# in promote.yml, so `main` keeps its single reviewed entry point.
#
# Do NOT trigger this on `pull_request_review`. The approval is submitted with
# GITHUB_TOKEN, and GitHub raises no workflow run for events caused by
# GITHUB_TOKEN, so that event never fires for the very review it is meant to
# react to. A completed Auto Reviewer run is the one signal that survives that
# guard, and `workflow_run` also guarantees this job runs main's copy of the
# file rather than a possibly stale one from a PR branch.

on:
  workflow_run:
    workflows: ["Auto Reviewer"]
    types: [completed]
  # Escape hatch: `gh workflow run auto-merge.yml -f pr=<n>` to retry a merge
  # that failed on infrastructure (gh/lib) rather than on the PR itself.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to merge
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    # Same-repo only: fork PRs get no secrets and are routed to human review,
    # matching auto-reviewer. `main` never merges here (promote.yml owns it).
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `gh` resolves the repository from a git remote; without a checkout the
      # merge step dies with "fatal: not a git repository".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Merge once approved and green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ github.event.inputs.pr }}
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          PR="${INPUT_PR:-${PAYLOAD_PR:-}}"
          if [ -z "${PR}" ] && [ -n "${HEAD_BRANCH:-}" ]; then
            PR=$(gh pr list --head "${HEAD_BRANCH}" --state open \
              --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR}" ]; then
            echo "No open PR found; nothing to merge."
            exit 0
          fi

          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          if [ "$base" != "dev" ]; then
            echo "PR #${PR} targets ${base}, not dev; nothing to merge."
            exit 0
          fi

          # A submitted approval is not enough on its own: `--request-changes`
          # after an approval (or vice versa) must win. latestReviews keeps one
          # review per reviewer, so require an APPROVED entry and no
          # CHANGES_REQUESTED one.
          approved=$(gh pr view "$PR" --json latestReviews \
            --jq '[.latestReviews[] | select(.state == "APPROVED")] | length')
          changes=$(gh pr view "$PR" --json latestReviews \
            --jq '[.latestReviews[] | select(.state == "CHANGES_REQUESTED")] | length')
          if [ "$approved" -eq 0 ] || [ "$changes" -gt 0 ]; then
            echo "PR #${PR} has no current approval; nothing to merge."
            exit 0
          fi

          # Auto Reviewer can approve within seconds of `opened`, often before
          # Validate Bundle has registered its check run. Wait for a check to
          # exist before trusting `gh pr checks`, otherwise an empty run list
          # would look like "nothing to fail" and merge an unvalidated PR.
          # `|| true` keeps `set -e` off the assignment: `gh pr checks` exits 8
          # while checks are pending, which is expected here and not an error.
          for _ in $(seq 1 60); do
            count=$(gh pr checks "$PR" --json name --jq 'length' 2>/dev/null) || true
            if [ "${count:-0}" -gt 0 ]; then
              break
            fi
            sleep 10
          done

          # --watch blocks until every check finishes and exits non-zero if any
          # failed, so a red PR is left open for a human instead of merged.
          gh pr checks "$PR" --watch --interval 15

          gh pr merge "$PR" --squash --delete-branch

          # Merging into `dev` does not close linked issues. GitHub only
          # auto-closes when the merge lands on the default branch, and this
          # repo promotes `dev` -> `main` with a plain push rather than a PR
          # merge, so the `Closes #N` link never fires on its own. Close the
          # loop here instead of leaving the issue open until someone notices.
          meta=$(gh pr view "$PR" --json body,headRefName \
            --jq '[(.body // ""), .headRefName] | join("\n")')
          linked=$(printf '%s\n' "$meta" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)
          if [ -z "$linked" ]; then
            # Fall back to the branch convention auto-developer relies on:
            # opencode/issue<N>-<timestamp>.
            linked=$(printf '%s\n' "$meta" \
              | grep -oE 'issue[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          fi
          for n in ${linked}; do
            gh issue close "$n" --comment "Shipped in #${PR}, merged into \`dev\`."
          done
